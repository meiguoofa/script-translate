[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "script-translate-backend"
version = "0.1.0"
description = "Script dialogue translation backend"
requires-python = ">=3.11"
dependencies = [
  "aiosqlite>=0.20.0",
  "alibabacloud-ice20201109>=6.19.0",
  "alibabacloud-mts20140618>=6.0.3",
  "alibabacloud-tea-openapi>=0.3.0",
  "alibabacloud-videoenhan20200320>=3.0.0",
  "alibabacloud-videorecog20200320>=3.0.0",
  "bce-python-sdk>=0.9.0",
  "boto3>=1.34.0",
  "fastapi>=0.115.0",
  "httpx>=0.28.0",
  "openai>=1.35.0",
  "oss2>=2.18.0",
  "pydantic-settings>=2.3.0",
  "python-docx>=1.1.2",
  "python-multipart>=0.0.9",
  "sqlalchemy>=2.0.30",
  "tos>=2.8.0",
  "uvicorn[standard]>=0.30.1",
  "volcengine-python-sdk>=5.0.35",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2.0",
  "pytest-asyncio>=0.23.7",
  "asgi-lifespan>=2.1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
